name: Check documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check and build Astro site
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
